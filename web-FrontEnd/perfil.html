<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --black-bg: #181818;
      --header-bg: #222;
      --header-text: #fff;
      --card-bg: #232323;
      --card-border: #333;
      --white: #fff;
      --gray: #bcbcbc;
      --gray-light: #eaeaea;
      --accent: #bcbcbc;
      --danger: #e63946;
      --success: #26b364;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: var(--black-bg);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
      width: 99vw;
      max-width: 900px;
      margin: 40px auto;
      min-height: 600px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .header {
      background: var(--header-bg);
      color: var(--header-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 2.5rem 0.7rem 2.5rem;
    }
    .nav {
      display: flex;
      gap: 2.2rem;
      align-items: center;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--header-text);
      font-size: 1.08rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.3rem 0.7rem;
      border-radius: 7px;
      transition: background 0.18s;
    }
    .nav-btn:hover {
      background: #333;
    }
    .perfil {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }
    .perfil-img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }
    .perfil-label {
      font-size: 0.82rem;
      color: var(--header-text);
    }
    .main-section {
      padding: 2.2rem 2.5rem 2.2rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .user-card {
      background: #222;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
      padding: 2rem 2.2rem 1.5rem 2.2rem;
      min-width: 320px;
      max-width: 400px;
      margin-bottom: 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--card-border);
    }
    .user-card h2 {
      color: var(--white);
      margin-bottom: 1.1rem;
      font-size: 1.35rem;
      font-weight: 700;
    }
    .user-info {
      font-size: 1.08rem;
      color: var(--gray);
      margin-bottom: 0.7rem;
      text-align: left;
      width: 100%;
    }
    .user-info p {
      margin: 0.3em 0;
    }
    .historial-section {
      width: 100%;
      max-width: 700px;
      margin-top: 1.2rem;
    }
    .historial-section h3 {
      color: var(--white);
      margin-bottom: 1.1rem;
      font-size: 1.18rem;
      font-weight: 700;
      text-align: left;
    }
    .reserva-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: flex-start;
    }
    .reserva-card {
      background: #232323;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      padding: 1rem 1.2rem;
      min-width: 220px;
      max-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border: 1px solid var(--card-border);
    }
    .reserva-titulo {
      font-weight: 600;
      color: var(--white);
      font-size: 1.07rem;
      margin-bottom: 0.2rem;
    }
    .reserva-estado {
      font-size: 0.98rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border-radius: 7px;
      padding: 0.2em 0.7em;
      display: inline-block;
      margin-bottom: 0.2em;
      letter-spacing: 0.5px;
    }
    .reserva-estado.pendiente {
      background: var(--danger);
    }
    .reserva-estado.devuelto {
      background: #444;
    }
    .reserva-fecha {
      font-size: 0.97rem;
      color: var(--gray);
      margin-bottom: 0.1em;
    }
    .reserva-label {
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .container { padding: 1.1rem; }
      .user-card { min-width: 0; max-width: 98vw; padding: 1.2rem; }
      .historial-section { max-width: 98vw; }
      .reserva-card { min-width: 0; max-width: 98vw; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="nav">
        <button class="nav-btn" onclick="window.location='index.html'">Inicio</button>
        <button class="nav-btn" onclick="window.location='reservas.html'">Mis reservas</button>
      </div>
      <div class="perfil">
        <div class="perfil-img"></div>
        <span class="perfil-label">Perfil</span>
      </div>
    </div>
    <div class="main-section">
      <div class="user-card" id="user-card">
        <h2>Datos del Usuario</h2>
        <div class="user-info" id="user-info"></div>
      </div>
      <div class="historial-section">
        <h3>Historial de Reservas</h3>
        <div class="reserva-list" id="reserva-list"></div>
      </div>
    </div>
  </div>
  <script>
    const usuarioId = localStorage.getItem('usuarioId');
    if (!usuarioId) {
      window.location.href = 'auth.html';
    }
    // Obtener datos del usuario
    fetch(`http://localhost:8080/api/usuarios/${usuarioId}`)
      .then(res => res.json())
      .then(usuario => {
        document.getElementById('user-info').innerHTML = `
          <p><b>Nombre:</b> ${usuario.nombre}</p>
          <p><b>Apellido:</b> ${usuario.apellido}</p>
          <p><b>Correo:</b> ${usuario.correo}</p>
          <p><b>DNI:</b> ${usuario.dni}</p>
          <p><b>Rol:</b> ${usuario.rol}</p>
        `;
      });
    // Obtener historial de reservas
    fetch(`http://localhost:8080/api/reservas/usuario/${usuarioId}`)
      .then(res => res.json())
      .then(data => {
        const reservaList = document.getElementById('reserva-list');
        if (!data.length) {
          reservaList.innerHTML = '<p style="width:100%;text-align:center;color:#888;">No tienes reservas.</p>';
          return;
        }
        data.forEach(reserva => {
          // Mostrar cada libro en detalles
          (reserva.detalles || []).forEach(detalle => {
            let estadoClass = '';
            if (reserva.estado === 'PENDIENTE') estadoClass = 'pendiente';
            else if (reserva.estado === 'DEVUELTO') estadoClass = 'devuelto';
            reservaList.innerHTML += `
              <div class="reserva-card">
                <div class="reserva-titulo">${detalle.tituloLibro || 'Libro desconocido'}</div>
                <div class="reserva-estado ${estadoClass}">${reserva.estado}</div>
                <div class="reserva-fecha"><span class="reserva-label">Reserva:</span> ${reserva.fechaReserva || '-'}</div>
                <div class="reserva-fecha"><span class="reserva-label">Devolución programada:</span> ${reserva.fechaDevolucion || '-'}</div>
                <div class="reserva-fecha"><span class="reserva-label">Devolución real:</span> ${reserva.fechaDevolucionReal || '-'}</div>
              </div>
            `;
          });
        });
      });
  </script>
</body>
</html>
